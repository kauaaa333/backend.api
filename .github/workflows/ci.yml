name: Backend - validacao
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: taskflow_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/taskflow_ci
      TEST_APP_DATABASE_URL: postgresql://app_usuario:ci-app-only@127.0.0.1:5432/taskflow_ci
      TEST_DATABASE_EXPECTED_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: node scripts/check-secrets.cjs
      - run: npm ci
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/taskflow_ci
          DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/taskflow_ci
      - run: npm audit --audit-level=high
      - run: node test/setup-ci.cjs
      - run: npm test
